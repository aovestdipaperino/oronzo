[package]
name = "oronzo"
version = "0.3.2"
edition = "2024"
description = "A toolkit for Claude Code sessions"
license = "MIT"

[lib]
name = "oronzo"
path = "src/main.rs"

[[bin]]
name = "oronzo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = { version = "3", features = ["json"] }
self-replace = "1"
comfy-table = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = "2"

[build-dependencies]
logo-art = "0.2"
image = "0.25"

[dev-dependencies]
tempfile = "3"
